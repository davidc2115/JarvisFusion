plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.assistant'
    // 36 requis par com.google.ai.edge.aicore (fusion Phase 4g) -- minSdk/targetSdk restent
    // inchanges, chaque appel AICore est protege par un try/catch avec repli propre
    // (AiCoreSessionFactory.tryCreate), voir aussi le <uses-sdk overrideLibrary> du manifest.
    compileSdk 36

    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "5.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "jarvispass123"
            keyAlias "jarvisdebugkey"
            keyPassword "jarvispass123"
        }
    }

    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
        debug   { minifyEnabled false; signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true }

    packaging {
        resources {
            pickFirsts += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md']
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

// FIX CI : une dependance transitive (play-services-auth 21.6.0 ou googleid 1.2.0) tire
// androidx.credentials en 1.6.0-beta01 malgre la version 1.5.0 declaree explicitement
// ci-dessous (resolution Gradle = plus haute version demandee, directe OU transitive gagne).
// 1.6.x exige AGP 8.6.0 (ce projet est en 8.5.2, voir plus haut) -- on force donc la
// resolution sur 1.5.0 pour toute la config, peu importe qui la redemande en interne.
configurations.all {
    resolutionStrategy {
        force 'androidx.credentials:credentials:1.5.0'
        force 'androidx.credentials:credentials-play-services-auth:1.5.0'
    }
}

dependencies {
    // Llamatik (wrapper Kotlin/AAR prebuilt autour de llama.cpp, fork "Bonsai" -- voir
    // LocalModelCatalog.LocalGgufModel.BONSAI_27B) : pas publie sur un depot Maven, fourni
    // directement comme fichier binaire dans app/libs/, resolu via fileTree ci-dessous.
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // ── Core Android ──────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    // ── Réseau ────────────────────────────────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.json:json:20240303'

    // ── Accès SMB/CIFS générique (voir SmbController) — partage réseau (NAS, PC
    // Windows, disque dur Freebox une fois son partage SMB activé côté Freebox OS).
    // Bibliothèque Java pure, aucune dépendance native, aucune clé/API requise.
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'

    // ── IA embarquée -- fusion Phase 4g ("RETIRE TOUT IA LOCAL DE NEWJARVIS, POUR GREFFER
    // SIMPLEMENT CELLE DE JARVIS2") : remplace l'ancien duo ML Kit GenAI Prompt API
    // (GeminiNanoController) + LiteRT-LM (LocalLlmController) par la chaîne AiEngineManager
    // de Jarvis2 :
    //  - com.google.ai.edge.aicore (SDK expérimental officiel Google, distinct de ML Kit
    //    GenAI ci-dessus) pour Gemini Nano/AICore natif — voir AiCoreEngine.
    //  - Llamatik (AAR local ci-dessus, wrapper llama.cpp) pour le catalogue GGUF optionnel
    //    (SelectableLlmEngine) et le modèle embarqué garanti SmolVLM2 (SmolVlmEngine).
    // Aucun compte ni jeton requis pour aucun de ces trois moteurs.
    implementation 'com.google.ai.edge.aicore:aicore:0.0.1-exp01'

    // ── ONNX Runtime : uniquement requis par la détection de mot-clé (openWakeWord,
    // voir WakeWordService) qui exécute ses propres petits modèles ONNX de classification
    // audio -- distinct de la génération de texte ci-dessus (retirée de ce runtime).
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // ── Email IMAP / SMTP ─────────────────────────────────────────────────────
    // JavaMail portage Android — lecture IMAP + envoi SMTP
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // ── Localisation ──────────────────────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ── OAuth Google (Agenda/Mail) -- greffe de l'integration actuelle (taches #247-249,
    // demande explicite de l'utilisateur de garder l'OAuth Google actuel en plus du systeme
    // IMAP/SMTP existant). Deux briques distinctes, toutes deux officiellement recommandees
    // par Google : Credential Manager = AUTHENTIFICATION (selecteur de compte natif) ;
    // play-services-auth (AuthorizationClient) = AUTORISATION (acces Gmail/Agenda, consentement
    // separe par scope). Un ID client OAuth (Google Cloud Console) reste indispensable dans les
    // deux cas -- exigence de l'infrastructure OAuth de Google elle-meme. 1.6.0+ de credentials
    // exige AGP 8.6.0 (ce projet est en 8.5.2) ; 1.5.0 est la derniere version stable compatible.
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'

    // ── Médias / ExoPlayer (optionnel : meilleure gestion audio) ─────────────
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'

    // ── Détection de mot-clé dédiée (écoute permanente basse consommation) ────
    // openWakeWord : 100% gratuit, SANS CLÉ NI COMPTE, hors-ligne et basse consommation
    // (modèles ONNX exécutés via onnxruntime-android, déjà présent ci-dessus) — seul moteur
    // utilisé, voir WakeWordService. Picovoice/Porcupine (moteur alternatif nécessitant un
    // compte/une clé d'accès) retiré à la demande explicite de l'utilisateur.
    implementation 'xyz.rementia:openwakeword:0.1.5'
}

// ── Modèles openWakeWord : téléchargés au moment du build (pas commités dans git, pour ne
// pas alourdir le dépôt de binaires) depuis les releases officielles GitHub du projet
// open-source openWakeWord (Apache-2.0, https://github.com/dscripka/openWakeWord), avec un
// miroir PyPI en repli (même fichiers, hébergement différent — files.pythonhosted.org plutôt
// que github.com, pour survivre à un blocage/souci ponctuel touchant l'un des deux). Le script
// est idempotent (un fichier déjà présent n'est pas re-téléchargé).
//
// BUG RÉEL CORRIGÉ (signalement utilisateur : "le déclenchement vocal par mot ne fonctionne
// pas") : jusqu'ici, un échec de TOUS les téléchargements laissait le build réussir quand même
// (juste un message d'avertissement dans les logs, jamais vraiment lu) — l'APK partait alors en
// production avec l'écoute permanente silencieusement cassée (aucun modèle présent), sans que
// personne ne le sache avant un signalement utilisateur des semaines plus tard. Le build ÉCHOUE
// désormais explicitement si un modèle manque encore après tous les repos, pour qu'un souci
// réseau CI soit visible IMMÉDIATEMENT (build rouge) plutôt que de livrer une fonctionnalité
// cassée en silence.
task downloadWakeWordModels {
    doLast {
        def assetsDir = file("src/main/assets")
        assetsDir.mkdirs()
        def ghRelease = "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1"
        def pypiMirror = "https://files.pythonhosted.org/packages/source/o/openwakeword/openwakeword-0.6.0.tar.gz"
        def files = [
            "melspectrogram.onnx" : ["${ghRelease}/melspectrogram.onnx"],
            "embedding_model.onnx": ["${ghRelease}/embedding_model.onnx"],
            "hey_jarvis.onnx"     : ["${ghRelease}/hey_jarvis_v0.1.onnx"],
            "alexa.onnx"          : ["${ghRelease}/alexa_v0.1.onnx"],
            "hey_mycroft.onnx"    : ["${ghRelease}/hey_mycroft_v0.1.onnx"]
        ]
        def failures = []
        files.each { name, urls ->
            def dest = new File(assetsDir, name)
            if (dest.exists() && dest.length() > 0L) return

            def done = false
            urls.each { url ->
                if (done) return
                def maxAttempts = 3
                def attempt = 1
                while (attempt <= maxAttempts && !done) {
                    try {
                        println "📥 Téléchargement du modèle mot-clé (openWakeWord) : ${name} depuis ${url} (tentative ${attempt}/${maxAttempts})"
                        new URL(url).openConnection().with { conn ->
                            conn.connectTimeout = 20000
                            conn.readTimeout = 30000
                            conn.instanceFollowRedirects = true
                            conn.setRequestProperty("User-Agent", "Mozilla/5.0 (compatible; JARVIS-build)")
                            dest.withOutputStream { out -> out << conn.inputStream }
                        }
                        done = dest.exists() && dest.length() > 0L
                    } catch (Exception e) {
                        println "⚠️ Tentative ${attempt}/${maxAttempts} échouée pour ${name} (${url}) : ${e.message}"
                        dest.delete()
                        if (attempt < maxAttempts) Thread.sleep(3000)
                    }
                    attempt++
                }
            }
            if (!done) failures.add(name)
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                "Échec du téléchargement des modèles openWakeWord (mot-clé d'activation) : " +
                failures.join(", ") + ". L'écoute permanente serait silencieusement cassée sans " +
                "ces fichiers — build volontairement interrompu plutôt que de livrer une " +
                "fonctionnalité cassée. Relance le build avec une connexion internet capable " +
                "d'atteindre github.com."
            )
        }
    }
}
preBuild.dependsOn downloadWakeWordModels
